name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, davidszakacs-v2-templates-smart-transitions]

jobs:
  # ── Detect which areas changed ─────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      share: ${{ steps.filter.outputs.share }}
      mcp: ${{ steps.filter.outputs.mcp }}
      landing: ${{ steps.filter.outputs.landing }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'packages/**'
              - 'public/**'
              - 'scripts/**'
              - 'docs/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'eslint.config.*'
              - 'index.html'
              - 'player.html'
              - '.github/workflows/ci.yml'
            mcp:
              - 'mcp-server/**'
              - 'packages/project-schema/**'
              - 'packages/animation-core/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-mcp.yml'
            share:
              - 'share-worker/**'
              - 'src/services/shareApi.ts'
              - 'src/services/shareTransport.ts'
              - 'public/_headers'
              - '.github/workflows/ci.yml'
            landing:
              - 'landing-page/**'
              - '.github/workflows/ci.yml'
            runtime:
              - 'packages/animation-core/**'
              - 'packages/player-runtime/**'
              - 'packages/export-runtime/**'
              - 'src/components/Sequence/**'
              - 'src/test-fixtures/**'
              - 'scripts/check-*-bundle.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  # ── Web App ────────────────────────────────────────────────────
  app-lint-and-test:
    name: 'App: Lint, Type Check & Test'
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b --pretty false
      - name: Test
        run: npm test
      - name: Validate release metadata
        run: npm run check:release-metadata

  app-build:
    name: 'App: Build'
    runs-on: ubuntu-latest
    needs: app-lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and validate templates
        run: npm run build
      - name: Enforce bundle boundaries and budgets
        run: npm run check:player-bundle && npm run check:export-bundle
      - name: Generate CycloneDX SBOM
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: web-app-dist
          path: dist/

  # ── Share Worker ────────────────────────────────────────────────
  share-worker-check:
    name: 'Share Worker: Type Check & Test'
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.share == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: share-worker/package-lock.json
      - working-directory: share-worker
        run: npm ci
      - name: Validate release metadata
        run: npm run check:release-metadata
      - working-directory: share-worker
        run: npm run check
      - name: Wrangler dry run
        working-directory: share-worker
        run: npx wrangler deploy --dry-run --outdir dist-dry-run

  # ── MCP Server ─────────────────────────────────────────────────
  mcp-check:
    name: 'MCP: Type Check & Test'
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build shared runtimes
        run: npm run build --workspace @excalimate/project-schema && npm run build --workspace @excalimate/animation-core
      - name: Type check
        run: npx tsc -p mcp-server/tsconfig.json --noEmit
      - name: Test
        run: npm test --workspace @excalimate/mcp-server

  mcp-build:
    name: 'MCP: Build'
    runs-on: ubuntu-latest
    needs: mcp-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace @excalimate/project-schema && npm run build --workspace @excalimate/animation-core && npm run build --workspace @excalimate/mcp-server
      - name: Verify package contents and provenance metadata
        run: npm run check:release-metadata && npm pack --dry-run --workspace @excalimate/project-schema && npm pack --dry-run --workspace @excalimate/animation-core && npm pack --dry-run --workspace @excalimate/mcp-server
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-server-dist
          path: mcp-server/dist/

  runtime-benchmarks:
    name: 'Runtime: Benchmarks'
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build shared runtimes
        run: npm run build --workspace @excalimate/project-schema && npm run build --workspace @excalimate/animation-core && npm run build --workspace @excalimate/player-runtime && npm run build --workspace @excalimate/export-runtime
      - name: Animation, scene diff, and player benchmarks
        run: npm run benchmark --workspace @excalimate/animation-core && npm run benchmark --workspace @excalimate/player-runtime
      - name: Export benchmark
        run: npm run benchmark --workspace @excalimate/export-runtime
      - name: Sequence benchmark
        run: npm run benchmark:sequence

  # ── Landing Page ───────────────────────────────────────────────
  landing-build:
    name: 'Landing: Build'
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - working-directory: landing-page
        run: npm ci
      - name: Type check
        working-directory: landing-page
        run: npm run check
      - name: Test
        working-directory: landing-page
        run: npm test
      - name: Build
        working-directory: landing-page
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: landing-page-dist
          path: landing-page/dist/
